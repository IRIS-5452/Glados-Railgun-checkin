name: mail diag (temporary)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run mail diagnostic
        run: python mail_diag.py
        env:
          GMAIL_PW: ${{ secrets.GMAIL_APP_PASSWORD }}
